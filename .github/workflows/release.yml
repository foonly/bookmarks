name: Release

on:
  push:
    tags:
      - "v*"

concurrency: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: make test
      - run: make
        env:
          VITE_API_BASE: "https://blob.foonly.dev/api/v1"
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_ed25519
          known_hosts: ${{ vars.KNOWN_HOSTS }}
      - name: Deploy Files
        # The key is restricted on the server to rsync into this site's web root
        # (rrsync), so the destination path is relative to it.
        run: rsync -rlci --delete dist/ "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:./"
